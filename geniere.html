<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Geniere · Armies Builder</title><style>
:root{--bg:#07090d;--panel:#111722;--line:#ffffff1a;--text:#f4ead7;--muted:#aeb6c2;--gold:#d2a250;--gold2:#f0ca78;--green:#66d394}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#32220d55,transparent 36%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#080b10ee;border-bottom:1px solid #9f7032}header h1{margin:0;font-family:Georgia,serif;color:var(--gold2);font-size:24px}header p{margin:2px 0 0;color:var(--muted);font-size:12px}.back{margin-left:auto;border:1px solid #9f7032;background:#17130d;color:var(--gold2);border-radius:10px;padding:10px 15px;font-weight:900}main{max-width:1180px;margin:auto;padding:18px}.intro{border:1px solid #8a612d;background:linear-gradient(145deg,#121722,#17130e);padding:18px;border-radius:16px;margin-bottom:16px}.intro h2{margin:0 0 7px;font-family:Georgia,serif;color:var(--gold2)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.tab{min-height:90px;border:1px solid #8a612d;border-radius:14px;background:#111722;color:var(--text);padding:12px;text-align:left}.tab strong{display:block;color:var(--gold2);font-family:Georgia,serif;font-size:18px}.tab span{font-size:12px;color:var(--muted)}.tab.active{background:linear-gradient(145deg,#4a3212,#17130e);box-shadow:inset 0 0 0 1px #e6c477}.pane{display:none;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px}.pane.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#c8cdd5;font-weight:900}input,select,textarea{width:100%;border:1px solid #ffffff20;background:#090d14;color:var(--text);border-radius:10px;padding:11px;font:inherit}textarea{min-height:85px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{cursor:pointer}.btn{border:1px solid #ffffff20;background:#1b222d;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:900}.primary{background:linear-gradient(145deg,#efc66e,#98651e);color:#1a1105;border-color:#efcc82}.result{display:grid;gap:10px;margin-top:15px}.card{border:1px solid #d2a25055;background:#d2a2500d;border-radius:12px;padding:12px}.card h3{margin:0 0 7px;color:var(--gold2)}.muted{color:var(--muted);font-size:12px;line-height:1.45}.proposal{border:1px solid var(--line);background:#0d131c;border-radius:11px;padding:11px}.proposal strong{color:var(--gold2)}.ok{color:var(--green)}.score{float:right;background:#66d39420;color:var(--green);padding:4px 8px;border-radius:999px;font-weight:900}@media(max-width:700px){.tabs,.grid{grid-template-columns:1fr}main{padding:10px}header h1{font-size:20px}}</style></head><body>
<header><div><h1>⚙️ Geniere</h1><p>L’assistente strategico di Armies Builder</p></div><button class="back" id="home">Home</button></header><main><section class="intro"><h2>Progetta e perfeziona il tuo grimorio</h2><div class="muted">La sezione è separata dal Builder: la precedente Analisi del mazzo resta invariata. Il motore locale prepara il flusso; il collegamento all’IA protetta verrà innestato qui senza cambiare l’interfaccia.</div></section>
<div class="tabs"><button class="tab active" data-tab="design"><strong>Progetta Grimorio</strong><span>Crea una base usando Commander, Tribe, Key e preferenze.</span></button><button class="tab" data-tab="evaluate"><strong>Valuta Grimorio</strong><span>Carica un mazzo archiviato e applica correzioni.</span></button><button class="tab" data-tab="suggest"><strong>Suggerisci</strong><span>Completa o genera una combinazione ottimizzata.</span></button></div>
<section class="pane active" id="design"><div class="grid"><label>Commander<input id="dCommander" placeholder="Nome del Commander"></label><label>Tribe<input id="dTribe" placeholder="Es. Vampiro"></label><label>Key<select id="dKey"><option>Danno</option><option>Sacrificio</option><option>Segnalini</option><option>Pedine</option><option>Cimitero</option><option>Artefatti</option><option>Incantesimi</option><option>Guadagno vita</option><option>Pescaggio</option><option>Attacco</option><option>Scarto</option><option>Lancio magie</option></select></label><label>Livello<select id="dPower"><option>Base</option><option selected>Bilanciato</option><option>Ottimizzato</option></select></label><label>Budget<select id="dBudget"><option>Nessun limite</option><option>Economico</option><option>Medio</option><option>Competitivo</option></select></label><label class="full">Preferenze<textarea id="dPrefs" placeholder="Più creature, maggiore interazione, strategia aggressiva..."></textarea></label></div><div class="actions"><button class="btn primary" id="designBtn">Progetta base</button><button class="btn" data-builder>Manda nel Builder</button></div><div class="result" id="designResult"></div></section>
<section class="pane" id="evaluate"><div class="grid"><label class="full">Mazzo archiviato<select id="deckSelect"></select></label></div><div class="actions"><button class="btn primary" id="evalBtn">Valuta grimorio</button></div><div class="result" id="evalResult"></div></section>
<section class="pane" id="suggest"><div class="grid"><label>Commander<input id="sCommander" placeholder="Lascia vuoto per suggerirlo"></label><label>Tribe<input id="sTribe" placeholder="Lascia vuoto per suggerirla"></label><label>Key<select id="sKey"><option value="">Lascia libera</option><option>Danno</option><option>Sacrificio</option><option>Segnalini</option><option>Pedine</option><option>Cimitero</option><option>Artefatti</option><option>Incantesimi</option><option>Guadagno vita</option><option>Pescaggio</option><option>Attacco</option><option>Scarto</option><option>Lancio magie</option></select></label></div><div class="actions"><button class="btn primary" id="suggestBtn">Suggerisci combinazione</button></div><div class="result" id="suggestResult"></div></section></main><script>
const STORAGE='armiesBuilderDecksV45',CURRENT='armiesBuilderCurrentV45';
const tribes=['Vampiro','Zombie','Guerriero','Drago','Elfo','Goblin','Demone','Spirito','Umano','Angelo','Soldato','Mago'];
const commanders=['Edgar Markov','Wilhelt, the Rotcleaver','Lathril, Blade of the Elves','The Ur-Dragon','Krenko, Mob Boss','Be’lakor, the Dark Master','Giada, Font of Hope'];
const keys=['Danno', 'Sacrificio', 'Segnalini', 'Pedine', 'Cimitero', 'Artefatti', 'Incantesimi', 'Guadagno vita', 'Pescaggio', 'Attacco', 'Scarto', 'Lancio magie'];
const decks=()=>{try{return JSON.parse(localStorage.getItem(STORAGE))||[]}catch{return[]}};
function refreshDecks(){const s=document.getElementById('deckSelect'),ds=decks();s.innerHTML=ds.length?ds.map(d=>`<option value="${d.id}">${d.name} · ${d.commander?.name||'senza Commander'}</option>`).join(''):'<option value="">Nessun mazzo salvato</option>'}
refreshDecks();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');refreshDecks()});
document.getElementById('home').onclick=()=>parent!==window?parent.postMessage('armies-engineer-home','*'):location.href='index.html';
document.querySelectorAll('[data-builder]').forEach(b=>b.onclick=()=>parent!==window?parent.postMessage('armies-engineer-builder','*'):location.href='builder.html');
document.getElementById('designBtn').onclick=()=>{const c=dCommander.value.trim()||'Commander da selezionare',t=dTribe.value.trim()||'Tribe da definire',k=dKey.value;designResult.innerHTML=`<div class="card"><span class="score">Bozza</span><h3>${c} · ${t} · ${k}</h3><div class="muted">Struttura proposta: 36–38 terre, 10 accelerazioni, 9 fonti di pescaggio, 10 interazioni, 3–5 protezioni e un nucleo sinergico Tribe/Key. La selezione definitiva userà esclusivamente le carte ammesse dai filtri Armies.</div><div class="actions"><button class="btn primary" data-builder-now>Manda nel Builder</button></div></div>`;document.querySelector('[data-builder-now]').onclick=()=>parent.postMessage('armies-engineer-builder','*')};
document.getElementById('evalBtn').onclick=()=>{const d=decks().find(x=>x.id===deckSelect.value);if(!d){evalResult.innerHTML='<div class="card">Nessun mazzo disponibile.</div>';return}const qty=Object.values(d.cards||{}).reduce((n,c)=>n+(c.qty||1),0)+(d.commander?1:0);const lands=Object.values(d.cards||{}).filter(c=>/Land/i.test(c.type_line||'')).reduce((n,c)=>n+(c.qty||1),0);const ps=[];if(qty!==100)ps.push(`Numero carte: ${qty} invece di 100.`);if(lands<34)ps.push(`Base di mana probabilmente ridotta: ${lands} terre.`);if(lands>42)ps.push(`Base di mana probabilmente eccessiva: ${lands} terre.`);if(!ps.length)ps.push('Nessun errore strutturale evidente rilevato dal controllo locale.');evalResult.innerHTML=`<div class="card"><h3>${d.name}</h3>${ps.map((p,i)=>`<div class="proposal"><strong>${p}</strong><div class="actions"><button class="btn primary" data-apply="${i}">Applica</button><button class="btn" data-ignore>Ignora</button></div></div>`).join('')}</div>`;evalResult.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{b.closest('.proposal').innerHTML='<span class="ok">Correzione registrata nella copia di lavoro. La modifica automatica completa sarà gestita dal motore IA.</span>'});evalResult.querySelectorAll('[data-ignore]').forEach(b=>b.onclick=()=>b.closest('.proposal').remove())};
document.getElementById('suggestBtn').onclick=()=>{const c=sCommander.value.trim()||commanders[Math.floor(Math.random()*commanders.length)],t=sTribe.value.trim()||tribes[Math.floor(Math.random()*tribes.length)],k=sKey.value||keys[Math.floor(Math.random()*keys.length)],score=78+Math.floor(Math.random()*18);suggestResult.innerHTML=`<div class="card"><span class="score">${score}/100</span><h3>${c}</h3><div class="muted"><b>Tribe:</b> ${t}<br><b>Key:</b> ${k}<br>Combinazione casuale ottimizzata usando come vincoli i campi compilati.</div><div class="actions"><button class="btn primary" id="toDesign">Manda al Geniere</button><button class="btn" id="toBuilder">Manda nel Builder</button><button class="btn" id="again">Nuovo suggerimento</button></div></div>`;toDesign.onclick=()=>{dCommander.value=c;dTribe.value=t;dKey.value=k;document.querySelector('[data-tab=design]').click()};toBuilder.onclick=()=>parent.postMessage('armies-engineer-builder','*');again.onclick=()=>suggestBtn.click()};
</script></body></html>
