<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Armies Builder</title>
<style>
:root{--bg:#07090d;--panel:#111722;--panel2:#171e2b;--line:#2b3442;--text:#f4ead7;--muted:#9da8b7;--gold:#d2a250;--gold2:#f0cd81;--green:#5bd38f;--red:#ec7373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#080b10ee;border-bottom:1px solid #805a2a;backdrop-filter:blur(10px)}.brand{font-family:Georgia,serif;font-weight:900;color:var(--gold2);font-size:20px}.grow{flex:1}.btn{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #ffffff18;background:linear-gradient(#242b36,#151a22);color:var(--text);font-weight:800}.btn.primary{background:linear-gradient(145deg,#efc66e,#98651e);color:#1a1105;border-color:#f0ce80}.btn.danger{color:#ffb2b2}.page{max-width:1550px;margin:auto;padding:14px}.panel{background:linear-gradient(180deg,#151c27,#0d1219);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 45px #0006}.config{display:grid;grid-template-columns:1.3fr 1fr 1fr .55fr auto;gap:10px;padding:14px;margin-bottom:14px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#c1c8d2;font-weight:900;margin-bottom:6px}.field input,.field select,.searchbar input,.searchbar select{width:100%;height:42px;border-radius:10px;border:1px solid #ffffff1d;background:#090d14;color:var(--text);padding:0 10px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,.7fr);gap:14px;align-items:start}.head{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-bottom:1px solid var(--line)}.head h2{font-size:15px;margin:0}.searchbar{display:grid;grid-template-columns:1fr 180px auto auto;gap:9px;padding:12px;border-bottom:1px solid var(--line)}.chips{display:flex;flex-wrap:wrap;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line)}.chip{font-size:11px;font-weight:800;color:#e5c77f;border:1px solid #d2a25044;background:#d2a25011;padding:5px 9px;border-radius:999px}.status{padding:10px 13px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;padding:12px;min-height:380px}.card{background:#141a23;border:1px solid #ffffff18;border-radius:14px;overflow:hidden;box-shadow:0 10px 25px #0006}.card img{width:100%;aspect-ratio:488/680;object-fit:cover;background:#090c11}.body{padding:10px}.name{font-weight:900;font-size:13px}.type{font-size:11px;color:var(--muted);min-height:30px;margin-top:4px}.actions{display:flex;gap:7px;margin-top:8px}.actions button{height:36px;border-radius:9px}.detail{flex:1;background:#222a36;color:var(--text);border:1px solid #ffffff16}.add{width:46px;background:linear-gradient(145deg,#efc36e,#94621d);color:#160f05;border:1px solid #f0c978;font-size:21px;font-weight:1000}.deck{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column}.commander{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);background:#d2a2500d}.commander img{width:70px;height:98px;object-fit:cover;border-radius:9px}.decklist{padding:9px;overflow:auto}.row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:8px;padding:8px;border-radius:9px;margin-bottom:5px;background:#ffffff05}.qty{width:30px;height:30px;border-radius:8px;background:#080b10;color:var(--gold2);display:grid;place-items:center;font-weight:1000}.rowbtns{display:flex;gap:5px}.small{width:30px;height:30px;border-radius:8px;background:#222a35;border:1px solid #ffffff18;color:var(--text);font-weight:1000}.summary{padding:12px 14px;border-top:1px solid var(--line);background:#090d14;display:flex;justify-content:space-between;font-weight:900}.empty{grid-column:1/-1;min-height:220px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed #ffffff1a;border-radius:14px;padding:20px}.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:#02040bcc;backdrop-filter:blur(8px)}.modal.open{display:grid}.box{width:min(920px,100%);max-height:90vh;overflow:auto;background:linear-gradient(#171e29,#0d1218);border:1px solid #ffffff20;border-radius:18px}.modalhead{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.modalhead strong{flex:1}.modalcontent{padding:14px}.commanderresults{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.library{display:grid;gap:9px}.saved{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px;background:#0b1017}.savedactions{display:flex;gap:6px;flex-wrap:wrap}.mobiletabs{display:none}
@media(max-width:950px){.config{grid-template-columns:1fr 1fr}.layout{display:block}.deck{position:relative;top:auto;max-height:none;margin-top:12px}.mobiletabs{position:fixed;bottom:10px;left:10px;right:10px;z-index:40;display:grid;grid-template-columns:1fr 1fr;padding:7px;border-radius:16px;background:#111722ee;border:1px solid #ffffff1a}.mobiletabs button{height:46px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:900}.mobiletabs button.active{background:#d2a25022;color:var(--gold2)}body.show-deck .catalog{display:none}body:not(.show-deck) .deck{display:none}body{padding-bottom:72px}}
@media(max-width:650px){.config,.searchbar{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}.type{display:none}.top{flex-wrap:wrap}.top .brand{width:100%}}
</style>
</head>
<body>
<header class="top"><button class="btn" id="homeBtn">← Home</button><div class="brand">Armies Builder</div><div class="grow"></div><button class="btn" id="decksBtn">I miei mazzi</button><button class="btn primary" id="saveBtn">Salva</button><button class="btn" id="exportBtn">Esporta</button></header>
<main class="page">
<section class="panel config">
<div class="field"><label>Nome mazzo</label><input id="deckName" value="Nuovo mazzo"></div>
<div class="field"><label>Commander</label><button class="btn" id="chooseCommander" style="width:100%">Scegli Commander</button></div>
<div class="field"><label>Tribe</label><select id="tribe" disabled><option value="">Prima scegli il Commander</option></select></div>
<div class="field"><label>Bracket</label><select id="bracket"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div>
<div class="field"><label>Key Armies</label><select id="key"></select></div>
</section>
<div class="layout">
<section class="panel catalog"><div class="head"><h2>Catalogo Scryfall filtrato</h2><div class="grow"></div><span id="resultCount"></span></div>
<div class="searchbar"><input id="search" placeholder="Cerca nel catalogo già filtrato"><select id="type"><option value="">Tutti i tipi</option><option value="creature">Creature</option><option value="instant">Istantanei</option><option value="sorcery">Stregonerie</option><option value="artifact">Artefatti</option><option value="enchantment">Incantesimi</option><option value="planeswalker">Planeswalker</option><option value="battle">Battaglie</option><option value="land">Terre</option></select><button class="btn primary" id="searchBtn">Cerca</button><button class="btn" id="resetBtn">Azzera</button></div>
<div class="chips" id="chips"></div><div class="status" id="status">Scegli un Commander e una Tribe.</div><div class="cards" id="cards"><div class="empty">Il catalogo mostrerà solo le carte utilizzabili.</div></div></section>
<aside class="panel deck"><div class="head"><h2>Il tuo mazzo</h2><div class="grow"></div><button class="btn danger" id="clearBtn">Svuota</button></div><div class="commander" id="commanderBox"></div><div class="decklist" id="deckList"></div><div class="summary"><span id="summaryText">0 carte</span><span id="validity">Da completare</span></div></aside>
</div></main>
<div class="mobiletabs"><button id="catalogTab" class="active">Catalogo</button><button id="deckTab">Mazzo</button></div>

<div class="modal" id="commanderModal"><div class="box"><div class="modalhead"><strong>Scegli Commander</strong><button class="btn" data-close="commanderModal">Chiudi</button></div><div class="modalcontent"><div class="searchbar" style="padding:0 0 12px;border:0;grid-template-columns:1fr auto"><input id="commanderSearch" placeholder="Nome del Commander"><button class="btn primary" id="commanderSearchBtn">Cerca</button></div><div id="commanderStatus" class="status"></div><div class="commanderresults" id="commanderResults"></div></div></div></div>
<div class="modal" id="detailModal"><div class="box"><div class="modalhead"><strong id="detailTitle">Dettagli</strong><button class="btn" data-close="detailModal">Chiudi</button></div><div class="modalcontent" id="detailContent"></div></div></div>
<div class="modal" id="decksModal"><div class="box"><div class="modalhead"><strong>I miei mazzi</strong><button class="btn" data-close="decksModal">Chiudi</button></div><div class="modalcontent library" id="library"></div></div></div>
<div class="modal" id="exportModal"><div class="box"><div class="modalhead"><strong>Esporta</strong><button class="btn" data-close="exportModal">Chiudi</button></div><div class="modalcontent" style="display:grid;gap:10px"><button class="btn primary" id="txtBtn">Scarica lista TXT</button><button class="btn" id="printBtn">Stampa proxy / Salva PDF</button><button class="btn" id="verifyBtn">Verifica mazzo</button><div id="verifyResult" class="status"></div></div></div></div>
<script>
const $=s=>document.querySelector(s);
const KEY_DEFINITIONS={
 "Danno":{terms:["damage","deals damage","combat damage","noncombat damage","excess damage"],keywords:["trample","double strike","first strike","deathtouch","toxic","infect","wither"]},
 "Sacrificio":{terms:["sacrifice","sacrificed","dies","died"],keywords:["exploit"]},
 "Segnalini":{terms:["counter","counters","+1/+1 counter","-1/-1 counter"],keywords:["adapt","amass","backup","evolve","fabricate","graft","mentor","modular","proliferate","riot"]},
 "Cimitero":{terms:["graveyard","dies","died","from your graveyard","into a graveyard"],keywords:["dredge","escape","flashback","jump-start","retrace","unearth","delve","disturb"]},
 "Pedine":{terms:["token","tokens","create a"],keywords:["amass","fabricate","incubate","living weapon","populate"]},
 "Pescata":{terms:["draw a card","draw cards"],keywords:["cycling"]},
 "Equipaggiamento":{terms:["equipment","equip","equipped creature"],keywords:["equip","reconfigure","living weapon","for mirrodin!"]},
 "Incantesimi":{terms:["enchantment","aura","enchanted","enchant "],keywords:["bestow","constellation"]},
 "Artefatti":{terms:["artifact","artifacts"],keywords:["affinity for artifacts","improvise","living weapon","modular","prototype"]},
 "Lifegain":{terms:["gain life","gained life","life you gained","lifegain"],keywords:["lifelink"]}
};
const EXCLUDED_ARMIES_TRIBES=new Set(["Army"]);
const FALLBACK_TRIBES=["Advisor","Angel","Artificer","Assassin","Beast","Bird","Cat","Cleric","Construct","Demon","Dragon","Druid","Dwarf","Elf","Elemental","Faerie","Goblin","Human","Knight","Merfolk","Orc","Pirate","Rogue","Shaman","Skeleton","Sliver","Soldier","Spirit","Vampire","Warrior","Wizard","Zombie"];
const STORAGE="armiesBuilderDecksV45", CURRENT="armiesBuilderCurrentV45";
let state={id:"",name:"Nuovo mazzo",commander:null,tribe:"",key:"Danno",bracket:2,cards:{}};
let currentCards=[];
function imageOf(c){return c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||""}
function oracleOf(c){return c.oracle_text||c.card_faces?.map(f=>f.oracle_text||"").join("\n")||""}
function typeOf(c){return c.type_line||c.card_faces?.map(f=>f.type_line||"").join(" // ")||""}
function escapeQuery(s){return String(s||"").replace(/["\\]/g," ").trim()}
function quote(s){return `"${escapeQuery(s)}"`}
function regexEscape(s){return String(s||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function exactWordQuery(field,word,{plural=true}={}){
 const safe=regexEscape(escapeQuery(word));
 const body=plural&&!/s$/i.test(word)?`${safe}s?`:safe;
 return `${field}:/\\b${body}\\b/i`;
}
function keyQuery(){const d=KEY_DEFINITIONS[state.key]||{terms:[],keywords:[]};const pieces=[...d.terms.map(x=>`o:${quote(x)}`),...d.keywords.map(x=>`kw:${quote(x)}`)];return pieces.length?`(${pieces.join(" or ")})`:""}
function cardFaces(c){return c.card_faces?.length?c.card_faces:[c]}
function faceOracle(f){return f.oracle_text||""}
function faceType(f){return f.type_line||""}
function isCreatureFace(f){return /(^|\s)Creature(\s|$)/i.test(faceType(f))}
function isLandFace(f){return /(^|\s)Land(\s|$)/i.test(faceType(f))}
function faceMentionsTribe(f,tribe){
 const safe=regexEscape(tribe);
 const plural=/s$/i.test(tribe)?safe:`${safe}s?`;
 const rx=new RegExp(`\\b${plural}\\b`,"i");
 return rx.test(faceType(f))||rx.test(faceOracle(f));
}
function faceMatchesKey(f,c){
 const d=KEY_DEFINITIONS[state.key]||{terms:[],keywords:[]};
 const oracle=faceOracle(f).toLowerCase();
 const terms=d.terms.some(term=>oracle.includes(term.toLowerCase()));
 const kws=(c.keywords||[]).map(k=>k.toLowerCase());
 const keywords=d.keywords.some(k=>kws.includes(k.toLowerCase())||oracle.includes(k.toLowerCase()));
 return terms||keywords;
}
function isEvergreenFace(f){const o=faceOracle(f).toLowerCase();return !isCreatureFace(f)&&(o.includes("commander")||o.includes("choose a creature type"))}
function armiesCardCompatible(c){
 const faces=cardFaces(c);
 const tribe=state.tribe;
 if(faces.some(isLandFace))return true;
 const citesTribe=faces.some(f=>faceMentionsTribe(f,tribe));
 const nonCreatureKeyFaces=faces.filter(f=>!isCreatureFace(f)&&faceMatchesKey(f,c));
 const citesKey=nonCreatureKeyFaces.length>0;
 // Caso speciale carte a più facce: una Key su una faccia non-creatura
 // non può rendere valida una carta se un'altra faccia è una creatura
 // che non cita/appartiene alla Tribe scelta.
 if(faces.length>1&&citesKey&&faces.some(f=>isCreatureFace(f)&&!faceMentionsTribe(f,tribe)))return false;
 return citesTribe||citesKey||faces.some(isEvergreenFace);
}
function colorQuery(){const ids=state.commander?.color_identity||[];return ids.length?`id<=${ids.join("")}`:"id:c"}
function armiesQuery(){
 if(!state.commander||!state.tribe)throw new Error("Scegli prima Commander e Tribe.");
 const tribe=escapeQuery(state.tribe);const tribeRule=`(t:creature (${exactWordQuery("t",tribe)} or ${exactWordQuery("o",tribe)}))`;const keyRule=`(-t:creature ${keyQuery()})`;const evergreen=`(-t:creature (o:${quote("commander")} or o:${quote("choose a creature type")}))`;const lands=`t:land`;
 const parts=[`(${tribeRule} or ${keyRule} or ${evergreen} or ${lands})`,colorQuery(),"game:paper","legal:commander"];
 if(Number(state.bracket)<=2)parts.push("-is:gamechanger");
 const typed=escapeQuery($("#search").value);if(typed)parts.push(`(${quote(typed)} or o:${quote(typed)})`);
 const type=$("#type").value;if(type)parts.push(`t:${type}`);
 return parts.join(" ");
}
async function scryfallSearch(q,maxPages=5){let url=`https://api.scryfall.com/cards/search?unique=cards&order=name&q=${encodeURIComponent(q)}`;const out=[];for(let i=0;i<maxPages&&url;i++){const r=await fetch(url);const data=await r.json();if(!r.ok)throw new Error(data.details||"Errore Scryfall");out.push(...(data.data||[]));url=data.has_more?data.next_page:null;}return out}
async function fetchCreatureTypes(){try{const r=await fetch("https://api.scryfall.com/catalog/creature-types");const d=await r.json();return (d.data||FALLBACK_TRIBES).filter(t=>!EXCLUDED_ARMIES_TRIBES.has(t))}catch{return FALLBACK_TRIBES.filter(t=>!EXCLUDED_ARMIES_TRIBES.has(t))}}
function commanderTribes(c,all){
 const lines=[c.type_line||"",...(c.card_faces||[]).map(f=>f.type_line||"")];
 const oracle=oracleOf(c);
 const found=[];
 for(const t of all){
  if(EXCLUDED_ARMIES_TRIBES.has(t))continue;
  const safe=t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const typeRx=new RegExp(`(^|\\s)${safe}(?=\\s|$)`,"i");
  // Il testo Oracle può usare il plurale (es. "amass Orcs 5").
  // Per i tipi che terminano già in s manteniamo solo la forma esatta.
  const pluralSafe=/s$/i.test(t)?safe:`${safe}s?`;
  const oracleRx=new RegExp(`\\b${pluralSafe}\\b`,"i");
  const inType=lines.some(line=>typeRx.test((line.split("—")[1]||"").trim()));
  if(inType||oracleRx.test(oracle))found.push(t);
 }
 return [...new Set(found)];
}
function loadCurrent(){try{const s=JSON.parse(localStorage.getItem(CURRENT));if(s)state={...state,...s,cards:s.cards||{}}}catch{}}
function saveCurrent(){state.name=$("#deckName").value.trim()||"Nuovo mazzo";state.tribe=$("#tribe").value;state.key=$("#key").value;state.bracket=Number($("#bracket").value);localStorage.setItem(CURRENT,JSON.stringify(state));renderDeck();renderChips()}
function deckStore(){try{return JSON.parse(localStorage.getItem(STORAGE))||[]}catch{return []}}
function writeStore(x){localStorage.setItem(STORAGE,JSON.stringify(x))}
function explicitSave(){saveCurrent();if(!state.id)state.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());const list=deckStore();const copy=JSON.parse(JSON.stringify(state));const i=list.findIndex(x=>x.id===state.id);if(i>=0)list[i]=copy;else list.push(copy);writeStore(list);localStorage.setItem(CURRENT,JSON.stringify(state));alert("Mazzo salvato.")}
function renderKeyOptions(){$("#key").innerHTML=Object.keys(KEY_DEFINITIONS).map(k=>`<option ${k===state.key?"selected":""}>${k}</option>`).join("")}
function renderChips(){$("#chips").innerHTML=[`Commander: ${state.commander?.name||"—"}`,`Tribe: ${state.tribe||"—"}`,`Key: ${state.key}`,`Bracket: ${state.bracket}`].map(x=>`<span class="chip">${x}</span>`).join("")}
function cardHTML(c,commander=false){return `<article class="card"><img loading="lazy" src="${imageOf(c)}" alt="${c.name}"><div class="body"><div class="name">${c.name}</div><div class="type">${typeOf(c)}</div><div class="actions"><button class="detail" data-detail="${c.id}">Dettagli</button><button class="add" data-${commander?"commander":"add"}="${c.id}">+</button></div></div></article>`}
function bindCards(root,commander=false){root.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>showDetail(currentCards.find(c=>c.id===b.dataset.detail)));root.querySelectorAll(commander?"[data-commander]":"[data-add]").forEach(b=>b.onclick=()=>{const c=currentCards.find(x=>x.id===(commander?b.dataset.commander:b.dataset.add));if(commander)selectCommander(c);else addCard(c)})}
function showDetail(c){if(!c)return;$("#detailTitle").textContent=c.name;$("#detailContent").innerHTML=`<div style="display:grid;grid-template-columns:minmax(220px,330px) 1fr;gap:18px"><img src="${imageOf(c)}" style="width:100%;border-radius:14px"><div><h2>${c.name}</h2><p>${typeOf(c)}</p><p style="white-space:pre-wrap;line-height:1.5">${oracleOf(c)}</p></div></div>`;$("#detailModal").classList.add("open")}
async function selectCommander(c){state.commander=c;state.cards={};const all=await fetchCreatureTypes();const tribes=commanderTribes(c,all);$("#tribe").disabled=false;$("#tribe").innerHTML=(tribes.length?tribes:all).map(t=>`<option>${t}</option>`).join("");state.tribe=tribes[0]||all[0]||"";$("#tribe").value=state.tribe;$("#chooseCommander").textContent=c.name;$("#commanderModal").classList.remove("open");saveCurrent();runSearch()}
async function commanderSearch(){const name=escapeQuery($("#commanderSearch").value);if(!name)return;$("#commanderStatus").textContent="Ricerca in corso…";try{currentCards=await scryfallSearch(`${quote(name)} is:commander game:paper legal:commander`,2);$("#commanderResults").innerHTML=currentCards.map(c=>cardHTML(c,true)).join("")||'<div class="empty">Nessun Commander trovato.</div>';$("#commanderStatus").textContent=`${currentCards.length} risultati`;bindCards($("#commanderResults"),true)}catch(e){$("#commanderStatus").textContent=e.message}}
async function runSearch(){saveCurrent();$("#status").textContent="Ricerca in corso…";$("#cards").innerHTML="";try{const q=armiesQuery();currentCards=(await scryfallSearch(q,6)).filter(armiesCardCompatible);$("#cards").innerHTML=currentCards.slice(0,180).map(c=>cardHTML(c)).join("")||'<div class="empty">Nessuna carta compatibile.</div>';$("#resultCount").textContent=`${currentCards.length} risultati`;$("#status").textContent="Sono mostrate soltanto carte compatibili con Commander, Tribe, Key e Bracket.";bindCards($("#cards"))}catch(e){$("#status").textContent=e.message;$("#cards").innerHTML='<div class="empty">Completa i filtri per vedere il catalogo.</div>';$("#resultCount").textContent=""}}
function copyLimit(c){const t=oracleOf(c).toLowerCase();if(t.includes("a deck can have any number of cards named"))return 99;const m=t.match(/a deck can have up to (\w+) cards named/i);if(m){const nums={two:2,three:3,four:4,five:5,six:6,seven:7};return nums[m[1].toLowerCase()]||1}return 1}
function addCard(c){const total=1+Object.values(state.cards).reduce((n,x)=>n+x.qty,0);if(total>=100){alert("Il mazzo ha già 100 carte.");return}const old=state.cards[c.id];const qty=old?.qty||0;if(qty>=copyLimit(c)){alert("Limite copie raggiunto.");return}state.cards[c.id]={...c,qty:qty+1};saveCurrent()}
function changeQty(id,d){const c=state.cards[id];if(!c)return;const next=c.qty+d;if(next<=0)delete state.cards[id];else if(next<=copyLimit(c))c.qty=next;saveCurrent()}
function renderDeck(){const commander=state.commander;$("#commanderBox").innerHTML=commander?`<img src="${imageOf(commander)}"><div><strong>${commander.name}</strong><div style="color:var(--muted);font-size:12px;margin-top:5px">Commander · ${state.tribe||"—"}</div></div>`:'<div style="color:var(--muted)">Nessun Commander selezionato.</div>';const entries=Object.values(state.cards).sort((a,b)=>a.name.localeCompare(b.name));$("#deckList").innerHTML=entries.map(c=>`<div class="row"><div class="qty">${c.qty}</div><div>${c.name}</div><div class="rowbtns"><button class="small" data-minus="${c.id}">−</button><button class="small" data-plus="${c.id}">+</button></div></div>`).join("")||'<div class="empty" style="min-height:160px">Il mazzo è vuoto.</div>';$("#deckList").querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));$("#deckList").querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));const count=(commander?1:0)+entries.reduce((n,c)=>n+c.qty,0);$("#summaryText").textContent=`${count} / 100 carte`;$("#validity").textContent=count===100?"Completo":"Da completare"}
function verifyDeck(){const errors=[];if(!state.commander)errors.push("Commander mancante.");if(!state.tribe)errors.push("Tribe mancante.");const count=(state.commander?1:0)+Object.values(state.cards).reduce((n,c)=>n+c.qty,0);if(count!==100)errors.push(`Il mazzo contiene ${count} carte invece di 100.`);for(const c of Object.values(state.cards))if(c.qty>copyLimit(c))errors.push(`${c.name}: troppe copie.`);$("#verifyResult").textContent=errors.length?errors.join(" "):"Mazzo valido.";return !errors.length}
function renderLibrary(){const list=deckStore();$("#library").innerHTML=list.map(d=>`<div class="saved"><div><strong>${d.name}</strong><div style="color:var(--muted);font-size:12px">${d.commander?.name||"Nessun Commander"} · ${d.tribe||"—"} · ${d.key||"—"}</div></div><div class="savedactions"><button class="btn" data-open="${d.id}">Apri</button><button class="btn" data-dup="${d.id}">Duplica</button><button class="btn danger" data-del="${d.id}">Elimina</button></div></div>`).join("")||'<div class="empty">Nessun mazzo salvato.</div>';$("#library").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDeck(b.dataset.open));$("#library").querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>duplicateDeck(b.dataset.dup));$("#library").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteDeck(b.dataset.del))}
function openDeck(id){const d=deckStore().find(x=>x.id===id);if(!d)return;state=JSON.parse(JSON.stringify(d));hydrate();$("#decksModal").classList.remove("open");if(state.commander&&state.tribe)runSearch()}
function duplicateDeck(id){const list=deckStore();const d=list.find(x=>x.id===id);if(!d)return;const copy=JSON.parse(JSON.stringify(d));copy.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());copy.name=`${copy.name} - copia`;list.push(copy);writeStore(list);renderLibrary()}
function deleteDeck(id){if(!confirm("Eliminare questo mazzo?"))return;writeStore(deckStore().filter(x=>x.id!==id));renderLibrary()}
function hydrate(){renderKeyOptions();$("#deckName").value=state.name||"Nuovo mazzo";$("#bracket").value=String(state.bracket||2);$("#key").value=state.key||"Danno";$("#chooseCommander").textContent=state.commander?.name||"Scegli Commander";if(state.commander){$("#tribe").disabled=false;$("#tribe").innerHTML=`<option>${state.tribe}</option>`;$("#tribe").value=state.tribe}else{$("#tribe").disabled=true;$("#tribe").innerHTML='<option value="">Prima scegli il Commander</option>'}renderDeck();renderChips()}
function downloadTxt(){saveCurrent();const lines=[`# ${state.name}`,`# Tribe: ${state.tribe} · Key: ${state.key} · Bracket: ${state.bracket}`,"",state.commander?`COMMANDER\n1 ${state.commander.name}\n`:"","DECK",...Object.values(state.cards).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`${c.qty} ${c.name}`)];const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${state.name.replace(/[^a-z0-9_-]+/gi,"-")}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printProxy(){const cards=[];if(state.commander)cards.push({...state.commander,qty:1});for(const c of Object.values(state.cards))for(let i=0;i<c.qty;i++)cards.push(c);if(!cards.length){alert("Il mazzo è vuoto.");return}const w=window.open("","_blank");if(!w){alert("Il browser ha bloccato la finestra di stampa.");return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><style>@page{size:A4;margin:8mm}body{margin:0}.bar{padding:10px;text-align:center;background:#111;color:#fff}.sheet{display:grid;grid-template-columns:repeat(3,63mm);grid-auto-rows:88mm;justify-content:center}.slot{width:63mm;height:88mm;border:.15mm dashed #bbb;overflow:hidden}.slot img{width:100%;height:100%;object-fit:fill}@media print{.bar{display:none}.slot:nth-child(9n){break-after:page}}</style></head><body><div class="bar"><button onclick="print()">Stampa / Salva PDF</button></div><div class="sheet">${cards.map(c=>`<div class="slot"><img src="${imageOf(c)}"></div>`).join("")}</div></body></html>`);w.document.close()}
$("#homeBtn").onclick=()=>{
 if(window.parent&&window.parent!==window){window.parent.postMessage("armies-home","*")}
 else{window.location.href="index.html"}
};$("#chooseCommander").onclick=()=>$("#commanderModal").classList.add("open");$("#commanderSearchBtn").onclick=commanderSearch;$("#commanderSearch").onkeydown=e=>{if(e.key==="Enter")commanderSearch()};$("#searchBtn").onclick=runSearch;$("#search").onkeydown=e=>{if(e.key==="Enter")runSearch()};$("#resetBtn").onclick=()=>{$("#search").value="";$("#type").value="";if(state.commander&&state.tribe)runSearch()};["tribe","key","bracket","type"].forEach(id=>$("#"+id).onchange=()=>{saveCurrent();if(state.commander&&state.tribe)runSearch()});$("#deckName").onchange=saveCurrent;$("#saveBtn").onclick=explicitSave;$("#decksBtn").onclick=()=>{renderLibrary();$("#decksModal").classList.add("open")};$("#exportBtn").onclick=()=>$("#exportModal").classList.add("open");$("#txtBtn").onclick=downloadTxt;$("#printBtn").onclick=printProxy;$("#verifyBtn").onclick=verifyDeck;$("#clearBtn").onclick=()=>{if(confirm("Svuotare il mazzo?")){state.cards={};saveCurrent()}};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$("#"+b.dataset.close).classList.remove("open"));$("#catalogTab").onclick=()=>{document.body.classList.remove("show-deck");$("#catalogTab").classList.add("active");$("#deckTab").classList.remove("active")};$("#deckTab").onclick=()=>{document.body.classList.add("show-deck");$("#deckTab").classList.add("active");$("#catalogTab").classList.remove("active")};
loadCurrent();hydrate();if(state.commander&&state.tribe)runSearch();
</script>
</body></html>
