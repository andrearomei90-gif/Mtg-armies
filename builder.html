<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Armies Builder</title>
<style>
:root{--bg:#07090d;--panel:#111722;--panel2:#171e2b;--line:#2b3442;--text:#f4ead7;--muted:#9da8b7;--gold:#d2a250;--gold2:#f0cd81;--green:#5bd38f;--red:#ec7373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#080b10ee;border-bottom:1px solid #805a2a;backdrop-filter:blur(10px)}.brand{font-family:Georgia,serif;font-weight:900;color:var(--gold2);font-size:20px}.grow{flex:1}.btn{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #ffffff18;background:linear-gradient(#242b36,#151a22);color:var(--text);font-weight:800}.btn.primary{background:linear-gradient(145deg,#efc66e,#98651e);color:#1a1105;border-color:#f0ce80}.btn.danger{color:#ffb2b2}.page{max-width:1550px;margin:auto;padding:14px}.panel{background:linear-gradient(180deg,#151c27,#0d1219);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 45px #0006}.config{display:grid;grid-template-columns:1.3fr 1fr 1fr .55fr auto;gap:10px;padding:14px;margin-bottom:14px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#c1c8d2;font-weight:900;margin-bottom:6px}.field input,.field select,.searchbar input,.searchbar select{width:100%;height:42px;border-radius:10px;border:1px solid #ffffff1d;background:#090d14;color:var(--text);padding:0 10px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.72fr) minmax(250px,.55fr);gap:14px;align-items:start}.head{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-bottom:1px solid var(--line)}.head h2{font-size:15px;margin:0}.searchbar{display:grid;grid-template-columns:1fr 180px 190px auto auto;gap:9px;padding:12px;border-bottom:1px solid var(--line)}.chips{display:flex;flex-wrap:wrap;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line)}.chip{font-size:11px;font-weight:800;color:#e5c77f;border:1px solid #d2a25044;background:#d2a25011;padding:5px 9px;border-radius:999px}.status{padding:10px 13px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;padding:12px;min-height:380px}.card{background:#141a23;border:1px solid #ffffff18;border-radius:14px;overflow:hidden;box-shadow:0 10px 25px #0006}.card img{width:100%;aspect-ratio:488/680;object-fit:cover;background:#090c11}.body{padding:10px}.name{font-weight:900;font-size:13px}.type{font-size:11px;color:var(--muted);min-height:30px;margin-top:4px}.actions{display:flex;gap:7px;margin-top:8px}.actions button{height:36px;border-radius:9px}.detail{flex:1;background:#222a36;color:var(--text);border:1px solid #ffffff16}.add{width:46px;background:linear-gradient(145deg,#efc36e,#94621d);color:#160f05;border:1px solid #f0c978;font-size:21px;font-weight:1000}.deck{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column}.commander{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);background:#d2a2500d}.commander img{width:70px;height:98px;object-fit:cover;border-radius:9px}.decklist{padding:9px;overflow:auto}.row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:8px;padding:8px;border-radius:9px;margin-bottom:5px;background:#ffffff05}.qty{width:30px;height:30px;border-radius:8px;background:#080b10;color:var(--gold2);display:grid;place-items:center;font-weight:1000}.rowbtns{display:flex;gap:5px}.small{width:30px;height:30px;border-radius:8px;background:#222a35;border:1px solid #ffffff18;color:var(--text);font-weight:1000}.summary{padding:12px 14px;border-top:1px solid var(--line);background:#090d14;display:flex;justify-content:space-between;font-weight:900}.empty{grid-column:1/-1;min-height:220px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed #ffffff1a;border-radius:14px;padding:20px}.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:#02040bcc;backdrop-filter:blur(8px)}.modal.open{display:grid}.box{width:min(920px,100%);max-height:90vh;overflow:auto;background:linear-gradient(#171e29,#0d1218);border:1px solid #ffffff20;border-radius:18px}.modalhead{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.modalhead strong{flex:1}.modalcontent{padding:14px}.commanderresults{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.library{display:grid;gap:9px}.saved{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px;background:#0b1017}.savedactions{display:flex;gap:6px;flex-wrap:wrap}.analysis{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}.analysisBody{padding:12px;display:grid;gap:12px}.metric{background:#090d14;border:1px solid var(--line);border-radius:12px;padding:11px}.metricTitle{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#c1c8d2;font-weight:900;margin-bottom:9px}.bigCount{font-size:28px;font-weight:1000;color:var(--gold2)}.subtle{font-size:12px;color:var(--muted)}.statRows{display:grid;gap:6px}.statRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px}.barTrack{height:8px;border-radius:999px;background:#ffffff0d;overflow:hidden}.barFill{height:100%;background:linear-gradient(90deg,#95611d,#efc66e);border-radius:999px}.curve{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;align-items:end;height:115px}.curveCol{display:grid;grid-template-rows:1fr auto;gap:5px;align-items:end;text-align:center;font-size:10px;color:var(--muted)}.curveBar{min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(#efc66e,#8d5b1b)}.manaColors{display:grid;gap:7px}.manaRow{display:grid;grid-template-columns:26px 1fr auto;gap:7px;align-items:center;font-size:12px}.manaPip{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#f2eadb;color:#111;font-weight:1000;border:1px solid #0004}.manaPip.U{background:#b8dff5}.manaPip.B{background:#514b55;color:#fff}.manaPip.R{background:#ef9b7f}.manaPip.G{background:#9ed09e}.manaPip.C{background:#c9c9c9}.warning{color:#ffb2b2}.ok{color:var(--green)}.colorPieWrap{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;margin-bottom:12px}.colorPie{width:112px;aspect-ratio:1;border-radius:50%;background:#202631;box-shadow:inset 0 0 0 1px #ffffff20,0 8px 20px #0005;position:relative}.colorPie:after{content:"";position:absolute;inset:31%;border-radius:50%;background:#0b1017;box-shadow:0 0 0 1px #ffffff18}.pieLegend{display:grid;gap:5px;font-size:11px}.pieLegendRow{display:grid;grid-template-columns:12px 1fr auto;gap:6px;align-items:center}.pieDot{width:10px;height:10px;border-radius:50%}@media(max-width:1250px){.colorPieWrap{grid-template-columns:90px 1fr}.colorPie{width:86px}}.mobiletabs{display:none}
@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 340px}.analysis{grid-column:2;position:relative;top:auto;max-height:none}.deck{grid-column:2}}
@media(max-width:1250px){.searchbar{grid-template-columns:1fr 150px 170px auto auto}}
@media(max-width:950px){.config{grid-template-columns:1fr 1fr}.searchbar{grid-template-columns:1fr 1fr}.searchbar button{width:100%}.layout{display:block}.deck,.analysis{position:relative;top:auto;max-height:none;margin-top:12px}.mobiletabs{position:fixed;bottom:10px;left:10px;right:10px;z-index:40;display:grid;grid-template-columns:1fr 1fr 1fr;padding:7px;border-radius:16px;background:#111722ee;border:1px solid #ffffff1a}.mobiletabs button{height:46px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:900}.mobiletabs button.active{background:#d2a25022;color:var(--gold2)}body.show-deck .catalog,body.show-analysis .catalog{display:none}body.show-analysis .deck{display:none}body.show-deck .analysis{display:none}body:not(.show-deck):not(.show-analysis) .deck,body:not(.show-deck):not(.show-analysis) .analysis{display:none}body{padding-bottom:72px}}
@media(max-width:650px){.config,.searchbar{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}.type{display:none}.top{flex-wrap:wrap}.top .brand{width:100%}}
</style>
</head>
<body>
<header class="top"><button class="btn" id="homeBtn">← Home</button><div class="brand">Armies Builder</div><div class="grow"></div><button class="btn" id="newDeckBtn">＋ Nuovo mazzo</button><button class="btn" id="decksBtn">I miei mazzi</button><button class="btn primary" id="saveBtn">Salva</button><button class="btn" id="exportBtn">Esporta</button></header>
<main class="page">
<section class="panel config">
<div class="field"><label>Nome mazzo</label><input id="deckName" value="Nuovo mazzo"></div>
<div class="field"><label>Commander</label><button class="btn" id="chooseCommander" style="width:100%">Scegli Commander</button></div>
<div class="field"><label>Tribe</label><select id="tribe" disabled><option value="">Prima scegli il Commander</option></select></div>
<div class="field"><label>Bracket</label><select id="bracket"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div>
<div class="field"><label>Key Armies</label><select id="key"></select></div>
</section>
<div class="layout">
<section class="panel catalog"><div class="head"><h2>Catalogo Scryfall filtrato</h2><div class="grow"></div><span id="resultCount"></span></div>
<div class="searchbar"><input id="search" placeholder="Cerca nel catalogo già filtrato"><select id="type"><option value="">Tutti i tipi</option><option value="creature">Creature</option><option value="instant">Istantanei</option><option value="sorcery">Stregonerie</option><option value="artifact">Artefatti</option><option value="enchantment">Incantesimi</option><option value="planeswalker">Planeswalker</option><option value="battle">Battaglie</option><option value="land">Terre</option></select><select id="landType" hidden><option value="">Tutte le terre</option><option value="basic">Terre base</option><option value="w">Producono Bianco</option><option value="u">Producono Blu</option><option value="b">Producono Nero</option><option value="r">Producono Rosso</option><option value="g">Producono Verde</option><option value="c">Producono Incolore</option><option value="multi">Multicolore</option><option value="fetch">Fetch</option><option value="shock">Shock</option><option value="pain">Pain</option><option value="check">Check</option><option value="fast">Fast</option><option value="slow">Slow</option><option value="bounce">Bounce</option><option value="triome">Triome</option><option value="dual">Dual</option><option value="utility">Utility</option></select><select id="sortOrder" title="Ordine risultati"><option value="affinity">Affinità col Commander</option><option value="name">Nome A–Z</option></select><button class="btn primary" id="searchBtn">Cerca</button><button class="btn" id="resetBtn">Azzera</button></div>
<div class="chips" id="chips"></div><div class="status" id="status">Scegli un Commander e una Tribe.</div><div class="cards" id="cards"><div class="empty">Il catalogo mostrerà solo le carte utilizzabili.</div></div></section>
<aside class="panel deck"><div class="head"><h2>Il tuo mazzo</h2><div class="grow"></div><button class="btn danger" id="clearBtn">Svuota</button></div><div class="commander" id="commanderBox"></div><div class="decklist" id="deckList"></div><div class="summary"><span id="summaryText">0 carte</span><span id="validity">Da completare</span></div></aside>
<aside class="panel analysis"><div class="head"><h2>Analisi mazzo</h2></div><div class="analysisBody" id="analysisBody"></div></aside>
</div></main>
<div class="mobiletabs"><button id="catalogTab" class="active">Catalogo</button><button id="deckTab">Mazzo</button><button id="analysisTab">Analisi</button></div>

<div class="modal" id="commanderModal"><div class="box"><div class="modalhead"><strong>Scegli Commander</strong><button class="btn" data-close="commanderModal">Chiudi</button></div><div class="modalcontent"><div class="searchbar" style="padding:0 0 12px;border:0;grid-template-columns:1fr auto"><input id="commanderSearch" placeholder="Nome del Commander"><button class="btn primary" id="commanderSearchBtn">Cerca</button></div><div id="commanderStatus" class="status"></div><div class="commanderresults" id="commanderResults"></div></div></div></div>
<div class="modal" id="detailModal"><div class="box"><div class="modalhead"><strong id="detailTitle">Dettagli</strong><button class="btn" data-close="detailModal">Chiudi</button></div><div class="modalcontent" id="detailContent"></div></div></div>
<div class="modal" id="decksModal"><div class="box"><div class="modalhead"><strong>I miei mazzi</strong><button class="btn" data-close="decksModal">Chiudi</button></div><div class="modalcontent library" id="library"></div></div></div>
<div class="modal" id="exportModal"><div class="box"><div class="modalhead"><strong>Esporta</strong><button class="btn" data-close="exportModal">Chiudi</button></div><div class="modalcontent" style="display:grid;gap:10px"><button class="btn primary" id="txtBtn">Scarica lista TXT</button><button class="btn" id="printBtn">Stampa proxy / Salva PDF</button><button class="btn" id="verifyBtn">Verifica mazzo</button><div id="verifyResult" class="status"></div></div></div></div>
<script>
const $=s=>document.querySelector(s);
const KEY_DEFINITIONS={
 "Attacco":{patterns:["\\battack(?:s|ed|ing)?\\b","\\braid\\b","\\bbattalion\\b","\\bexalted\\b","\\bmyriad\\b"],keywords:["raid","battalion","exalted","myriad"]},
 "Aura":{patterns:["\\bauras?\\b","\\benchant(?:ed|ing|s)?\\b","\\bbestow\\b"],keywords:["enchant","bestow"]},
 "Blocco":{patterns:["\\bblock(?:s|ed|ing|er|ers)?\\b","\\bmenace\\b","\\breach\\b"],keywords:["menace","reach"]},
 "Caso":{patterns:["\\brandom\\b","\\bcoin\\b","\\bflip a coin\\b","\\bdie\\b","\\bdice\\b","\\broll(?:s|ed|ing)?\\b"],keywords:[]},
 "Copia":{patterns:["\\bcopy(?:y|ies|ied|ing)?\\b","\\bcopied\\b"],keywords:["replicate","storm"]},
 "Danno":{patterns:["\\bdamage\\b","\\bdeals? damage\\b","\\bcombat damage\\b","\\bnoncombat damage\\b","\\bexcess damage\\b","\\bdeathtouch\\b","\\bfirst strike\\b","\\bdouble strike\\b","\\btrample\\b","\\btoxic\\b","\\binfect\\b","\\bwither\\b"],keywords:["deathtouch","first strike","double strike","trample","toxic","infect","wither"]},
 "Distruzione":{patterns:["\\bdestroy(?:s|ed|ing)?\\b","\\bindestructible\\b"],keywords:["indestructible"]},
 "Equipaggiamento":{patterns:["\\bequipment\\b","\\bequip(?:ped|s|ping)?\\b","\\breconfigure\\b","\\bliving weapon\\b","\\bfor mirrodin!\\b"],keywords:["equip","reconfigure","living weapon","for mirrodin!"]},
 "Esilia - sé stessa":{patterns:["\\bexile (?:this|it|that card|this card)\\b","\\bexile [^.!?]{0,80} from (?:your|its owner's) graveyard\\b","\\bexile [^.!?]{0,80} as (?:an additional )?cost\\b","\\bexile [^.!?]{0,80} instead\\b","\\bescape\\b","\\bflashback\\b","\\bdelve\\b","\\bforetell\\b","\\bsuspend\\b","\\bplot\\b"],keywords:["escape","flashback","delve","foretell","suspend","plot"]},
 "Esilia - altre carte":{patterns:["\\bexile target\\b","\\bexile another\\b","\\bexile all\\b","\\bexile each\\b","\\bexile up to\\b","\\bexile a card\\b","\\bexile cards?\\b","\\bexile permanents?\\b"],keywords:[]},
 "Gira":{patterns:["\\bturn(?:s|ed|ing)? [^.!?]{0,50} face (?:up|down)\\b","\\bflip(?:s|ped|ping)?\\b","\\btransform(?:s|ed|ing)?\\b","\\bmorph\\b","\\bmanifest\\b","\\bdisguise\\b","\\bcloak\\b"],keywords:["morph","manifest","disguise","cloak","transform"]},
 "Macina":{patterns:["\\bmill(?:s|ed|ing)?\\b","\\bput [^.!?]{0,60} cards? from [^.!?]{0,40} library into [^.!?]{0,30} graveyard\\b"],keywords:["mill"]},
 "Manovrare":{patterns:["\\bcrew\\b","\\bcrewed\\b"],keywords:["crew"]},
 "Neutralizza":{patterns:["\\bcounter target\\b","\\bcounter that\\b","\\bcounter it\\b","\\bcan't be countered\\b"],keywords:[]},
 "Paga":{patterns:["\\bpay(?:s|ing|ed)?\\b","\\bpaid\\b"],keywords:[]},
 "Pedina":{patterns:["\\btokens?\\b","\\bcreate(?:s|d|ing)? a\\b","\\bamass\\b","\\bfabricate\\b","\\bincubate\\b","\\bpopulate\\b","\\bliving weapon\\b"],keywords:["amass","fabricate","incubate","populate","living weapon"]},
 "Pesca":{patterns:["\\bdraw(?:s|n|ing)?\\b","\\bdrew\\b","\\bcycling\\b"],keywords:["cycling"]},
 "Profetizza":{patterns:["\\bscry\\b","\\bscries\\b","\\bscrying\\b"],keywords:["scry"]},
 "Regala":{patterns:["\\bgift\\b","\\bpromised a gift\\b"],keywords:["gift"]},
 "Riprendere":{patterns:["\\brebound\\b"],keywords:["rebound"]},
 "Rivela":{patterns:["\\breveal(?:s|ed|ing)?\\b","\\brevealed\\b"],keywords:[]},
 "Sacrifica":{patterns:["\\bsacrifice(?:s|d|ing)?\\b","\\bsacrificed\\b","\\bexploit\\b"],keywords:["exploit"]},
 "Santuario":{patterns:["\\bshrine(?:s)?\\b"],keywords:[]},
 "Scarta":{patterns:["\\bdiscard(?:s|ed|ing)?\\b","\\bmadness\\b","\\bcycling\\b"],keywords:["madness","cycling"]},
 "Segnalino":{patterns:["\\bcounters?\\b","\\bproliferate\\b","\\badapt\\b","\\bamass\\b","\\bbackup\\b","\\bevolve\\b","\\bfabricate\\b","\\bgraft\\b","\\bmentor\\b","\\bmodular\\b","\\briot\\b"],keywords:["proliferate","adapt","amass","backup","evolve","fabricate","graft","mentor","modular","riot"]},
 "Soglia":{patterns:["\\bthreshold\\b"],keywords:["threshold"]},
 "Spendere":{patterns:["\\bspend(?:s|ing)?\\b","\\bspent\\b"],keywords:[]},
 "Terraferma":{patterns:["\\blandfall\\b","\\ba land enters(?: the battlefield)? under your control\\b"],keywords:["landfall"]},
 "Tornare":{patterns:["\\breturn(?:s|ed|ing)?\\b","\\breturned\\b","\\bput [^.!?]{0,80} (?:onto the battlefield|into your hand|on top of|from [^.!?]{0,40} graveyard)\\b"],keywords:["unearth","disturb","recover"]},
 "Vacuità":{patterns:["\\bdevoid\\b"],keywords:["devoid"]},
 "Vita - guadagno":{patterns:["\\bgain(?:s|ed|ing)? [^.!?]{0,20} life\\b","\\blife total becomes?\\b","\\bdouble [^.!?]{0,20} life total\\b","\\blifelink\\b"],keywords:["lifelink"]},
 "Vita - perdita":{patterns:["\\blose(?:s|st|ing)? [^.!?]{0,20} life\\b","\\blost [^.!?]{0,20} life\\b","\\bhalf [^.!?]{0,20} life total\\b","\\blife total becomes?\\b"],keywords:[]},
 "Vota":{patterns:["\\bvote(?:s|d|ing)?\\b","\\bwill of the council\\b","\\bcouncil's dilemma\\b","\\bassist\\b"],keywords:["assist"]}
};
const EXCLUDED_ARMIES_TRIBES=new Set(["Army"]);
const FALLBACK_TRIBES=["Advisor","Angel","Artificer","Assassin","Beast","Bird","Cat","Cleric","Construct","Demon","Dragon","Druid","Dwarf","Elf","Elemental","Faerie","Goblin","Human","Knight","Merfolk","Orc","Pirate","Rogue","Shaman","Skeleton","Sliver","Soldier","Spirit","Vampire","Warrior","Wizard","Zombie"];
const STORAGE="armiesBuilderDecksV45", CURRENT="armiesBuilderCurrentV45";
let state={id:"",name:"Nuovo mazzo",commander:null,tribe:"",key:"Danno",bracket:2,cards:{}};
let currentCards=[];
function imageOf(c){return c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||""}
function oracleOf(c){return c.oracle_text||c.card_faces?.map(f=>f.oracle_text||"").join("\n")||""}
function typeOf(c){return c.type_line||c.card_faces?.map(f=>f.type_line||"").join(" // ")||""}
function escapeQuery(s){return String(s||"").replace(/["\\]/g," ").trim()}
function quote(s){return `"${escapeQuery(s)}"`}
function regexEscape(s){return String(s||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function exactWordQuery(field,word,{plural=true}={}){
 const safe=regexEscape(escapeQuery(word));
 const body=plural&&!/s$/i.test(word)?`${safe}s?`:safe;
 return `${field}:/\\b${body}\\b/i`;
}
function keyQuery(){
 const d=KEY_DEFINITIONS[state.key]||{patterns:[],keywords:[]};
 const pieces=[...(d.patterns||[]).map(x=>`o:/${x}/i`),...(d.keywords||[]).map(x=>`kw:${quote(x)}`)];
 // Scryfall può interpretare in modo più restrittivo alcune regex complesse.
 // Per Sacrifica aggiungiamo anche la ricerca testuale semplice: intercetta
 // sacrifice, sacrifices, sacrificed e sacrificing; il controllo locale
 // successivo mantiene comunque la precisione del filtro.
 if(state.key==="Sacrifica")pieces.unshift(`o:sacrifice`);
 return pieces.length?`(${pieces.join(" or ")})`:"";
}
function cardFaces(c){return c.card_faces?.length?c.card_faces:[c]}
function faceOracle(f){return f.oracle_text||""}
function faceType(f){return f.type_line||""}
function isCreatureFace(f){return /(^|\s)Creature(\s|$)/i.test(faceType(f))}
function isLandFace(f){return /(^|\s)Land(\s|$)/i.test(faceType(f))}
function faceMentionsTribe(f,tribe){
 const safe=regexEscape(tribe);
 const plural=/s$/i.test(tribe)?safe:`${safe}s?`;
 const rx=new RegExp(`\\b${plural}\\b`,"i");
 return rx.test(faceType(f))||rx.test(faceOracle(f));
}
function faceMatchesKey(f,c){
 const d=KEY_DEFINITIONS[state.key]||{patterns:[],keywords:[]};
 const oracle=faceOracle(f);
 return (d.patterns||[]).some(p=>{try{return new RegExp(p,"i").test(oracle)}catch{return false}});
}
function isEvergreenFace(f){const o=faceOracle(f).toLowerCase();return !isCreatureFace(f)&&(o.includes("commander")||o.includes("choose a creature type"))}
function isChangelingCard(c){return (c.keywords||[]).some(k=>String(k).toLowerCase()==="changeling")||/\bchangeling\b/i.test(oracleOf(c))}
function isChosenTypeCreatureFace(f,c){
 if(!isCreatureFace(f)||isChangelingCard(c))return false;
 const o=faceOracle(f).toLowerCase();
 if(!o.includes("choose a creature type"))return false;
 // Sono sempre valide solo le creature che scelgono un tipo e diventano
 // realmente quel tipo, non ogni carta che si limita a scegliere una Tribe.
 return /(?:is|becomes?) the chosen type(?: in addition to (?:its|their) other types)?/.test(o)||
        /(?:has|gains?) the chosen creature type/.test(o)||
        /chosen type in addition to (?:its|their) other types/.test(o);
}
function armiesCardCompatible(c){
 const faces=cardFaces(c);
 const tribe=state.tribe;
 const creatureFaces=faces.filter(isCreatureFace);

function commanderTribes(c,all){

function duplicateDeck(id){const list=deckStore();const d=list.find(x=>x.id===id);if(!d)return;const copy=JSON.parse(JSON.stringify(d));copy.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());copy.name=`${copy.name} - copia`;list.push(copy);writeStore(list);renderLibrary()}
function deleteDeck(id){if(!confirm("Eliminare questo mazzo?"))return;writeStore(deckStore().filter(x=>x.id!==id));renderLibrary()}

 const hasWork=state.commander||Object.keys(state.cards||{}).length||((state.name||"")!=="Nuovo mazzo");

 hydrate();
}

e unite e centrate, ciascuna 63 x 88 mm. In stampa scegli scala 100% / dimensioni effettive e margini nessuno.</small></div>${pages.map(page=>`<section class="page">${Array.from({length:9},(_,i)=>page[i]?`<div class="slot"><img src="${imageOf(page[i])}" alt="${page[i].name.replace(/"/g,'&quot;')}"></div>`:`<div class="empty-slot"></div>`).join("")}</section>`).join("")}<script>document.getElementById('doPrint').onclick=async()=>{const imgs=[...document.images];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})));window.print()};<\/script></body></html>`);w.document.close()}

async function fetchCardsByNames(names){
 const unique=[...new Set((names||[]).map(x=>String(x||'').trim()).filter(Boolean))];
 const out=[];
 for(let i=0;i<unique.length;i+=75){
  const chunk=unique.slice(i,i+75);
  const r=await fetch('https://api.scryfall.com/cards/collection',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({identifiers:chunk.map(name=>({name}))})
  });
  const data=await r.json();
  if(!r.ok)throw new Error(data.details||'Impossibile recuperare la lista carte da Scryfall.');
  out.push(...(data.data||[]));
 }
 return out;
}
async function importEngineerDeck(blueprint){
 const list=Array.isArray(blueprint?.deck_cards)?blueprint.deck_cards:[];
 if(!list.length)return {added:0,skipped:0,missing:99};
 $('#status').textContent='Il Geniere sta recuperando e validando le carte…';
 const cards=await fetchCardsByNames(list.map(x=>x.name));
 const byName=new Map(cards.map(c=>[c.name.toLowerCase(),c]));
 let added=0,skipped=0;
 const importedCards={};
 for(const item of list){
  const c=byName.get(String(item.name||'').trim().toLowerCase());
  if(!c||!armiesCardCompatible(c)){skipped+=Math.max(1,Number(item.qty)||1);continue}
  const requested=Math.max(1,Number(item.qty)||1);
  const qty=Math.min(requested,copyLimit(c),99-added);
  if(qty<=0)continue;
  importedCards[c.id]={...c,qty};
  added+=qty;
  if(added>=99)break;
 }
 if(added>0)state.cards=importedCards;
 saveCurrent();
 return {added,skipped,missing:Math.max(0,99-added),requested:list.reduce((n,x)=>n+Math.max(1,Number(x.qty)||1),0),found:cards.length};
}

async function consumeEngineerHandoff(){
 const key='armiesBuilderEngineerHandoffV45';let h=null;
 try{h=JSON.parse(localStorage.getItem(key));localStorage.removeItem(key)}catch{}
 if(!h)return false;
 if(h.openCurrent){loadCurrent();hydrate();if(state.commander&&state.tribe)await runSearch();return true}
 const commanderName=String(h.commanderName||'').trim();
 if(!commanderName)return false;
 $('#status').textContent='Importazione dal Geniere…';
 try{
  const found=await scryfallSearch(`!${quote(commanderName)} is:commander game:paper legal:commander`,2);
  const c=found[0]||null;if(!c)throw new Error('Commander non trovato su Scryfall.');
  await selectCommander(c);
  if(h.tribe){const wanted=String(h.tribe);if(![...$('#tribe').options].some(o=>o.value===wanted))$('#tribe').add(new Option(wanted,wanted));state.tribe=wanted;$('#tribe').value=wanted}
  if(h.key&&Object.prototype.hasOwnProperty.call(KEY_DEFINITIONS,h.key)){state.key=h.key;$('#key').value=h.key}
  state.name=state.name==='Nuovo mazzo'?`${c.name} · ${state.tribe||'Armies'}`:state.name;
  $('#deckName').value=state.name;saveCurrent();renderChips();
  let imported=null;
  if(h.blueprint?.deck_cards?.length)imported=await importEngineerDeck(h.blueprint);
  await runSearch();
  if(imported){
   $('#status').textContent=imported.missing
    ?`Mazzo del Geniere importato: richieste ${imported.requested}, trovate su Scryfall ${imported.found}, aggiunte ${imported.added}, mancanti ${imported.missing}. Le carte non riconosciute o non legali sono state escluse.`
    :`Mazzo completo del Geniere importato e validato: 99 carte più il Commander.`;
  }else $('#status').textContent='Combinazione ricevuta dal Geniere. Il catalogo mostra solo carte compatibili.';
  return true;
 }catch(e){$('#status').textContent='Importazione dal Geniere non riuscita: '+e.message;return false}
}
(async()=>{loadCurrent();hydrate();const imported=await consumeEngineerHandoff();if(!imported&&state.commander&&state.tribe)runSearch()})();
